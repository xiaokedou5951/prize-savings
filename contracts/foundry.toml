[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
quote_style = "double"

[rpc_endpoints]
# 本地开发链（anvil）
local = "http://127.0.0.1:8545"
# Base 主网 / Base Sepolia：RPC URL 从环境变量读取，不入库（fork 测试与测试网部署用）
base = "${BASE_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"

[invariant]
# handler-based 状态机 fuzz：每条不变量跑 256 轮、每轮最多 15 个随机动作；
# 动作 revert 不视为失败（仅跳过），保证边界守卫下的覆盖率。
runs = 256
depth = 15
fail_on_revert = false