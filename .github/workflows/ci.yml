name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contracts (fmt / build / test / ABI diff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry toolchain
        uses: foundry-rs/foundry-toolchain@v1
        with:
          # 钉到与本地一致的 1.5.1：新版 stable 对继承自 abstract base 的 invariant
          # 测试发现行为有变（handler 套件每套件只跑 1 条而非 3 条），钉版本保证 CI
          # 与本地跑同一套 58 个测试（含 handler 状态机的 3×2 不变量 fuzz）。
          version: 1.5.1

      - name: Cache forge dependencies
        id: cache-forge-lib
        uses: actions/cache@v4
        with:
          path: contracts/lib
          key: forge-lib-${{ hashFiles('contracts/install-deps.sh') }}

      - name: Install forge dependencies
        if: steps.cache-forge-lib.outputs.cache-hit != 'true'
        run: bash contracts/install-deps.sh

      - name: forge fmt --check
        run: forge fmt --root contracts --check

      - name: forge build
        run: forge build --root contracts

      - name: forge test
        run: forge test --root contracts

      - name: Verify generated ABI is up to date (no diff)
        run: |
          forge build --root contracts
          node scripts/gen-abis.mjs
          git diff --exit-code -- packages/contracts/src/abis

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm frontend:build

  keeper:
    name: Keeper build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build keeper
        run: pnpm keeper:build
